# Beacon isn't accepting pull requests from outside contributors yet. GitHub has no setting that
# turns pull requests off, so this workflow closes a pull request whose author isn't an owner,
# member or collaborator, with a comment that points to the issues. Bots such as Dependabot are
# left alone. Delete this file when the project opens to outside pull requests.
#
# The workflow runs on `pull_request_target`, so a fork's pull request gets a token that can close
# it. The job never checks out or runs the pull request's code.
name: Close outside pull requests

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    if: >-
      github.event.pull_request.user.type != 'Bot' &&
      !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comment and close
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          ISSUES: ${{ github.server_url }}/${{ github.repository }}/issues/new/choose
        run: |
          gh pr close "$NUMBER" --comment "Thank you for the pull request. Beacon isn't accepting pull requests from outside contributors right now, so this one is closed. Please open an issue instead: $ISSUES. To report a vulnerability, follow the repository's security policy and don't open a public issue."
