packages:
  - "packages/*/*" # the server tier (packages/server/*); the tier is the directory (@beaconsgg/eslint-config)
  - "apps/*" # apps/server (apps/atlas has no manifest, so the glob skips it)
  - "apps/atlas/*" # Atlas's builder, Cartographer (osm-import has no manifest: a Lua style and a Dockerfile)

# One version range per shared dependency; a manifest names it with "catalog:".
catalog:
  zod: ^4.6.7 # a peer of @beaconsgg/protocol-types, so the server declares it (beacon.core's doc/core-compatibility.md §7)
  ulid: ^2.3.0
  # The server app (NestJS)
  "@nestjs/common": ^10.4.15
  "@nestjs/core": ^10.4.15
  "@nestjs/platform-express": ^10.4.15
  "@nestjs/websockets": ^10.4.15
  "@nestjs/platform-socket.io": ^10.4.15
  socket.io: ^4.8.1
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.1
  pg: ^8.13.1
  "@types/pg": ^8.11.10
  # Image re-encode, for Cartographer's media crawl (@beaconsgg/image-encode)
  sharp: ^0.33.5
  yauzl: ^3.2.0
  "@types/yauzl": ^2.10.3
  yazl: ^3.3.1
  "@types/yazl": ^2.4.6
  "@types/node": ^22.10.0
  # Toolchain
  typescript: ^5.7.3
  vitest: ^2.1.8
  "@vitest/coverage-v8": ^2.1.8
  eslint: ^9.18.0
  prettier: ^3.4.2
  turbo: ^2.3.3

# Native deps allowed to run their install scripts.
onlyBuiltDependencies:
  - esbuild
  - "@nestjs/core"
